name: Build Minecraft Client

on:
  push:
    branches: [ "main", "master", "26.1.2" ]
  pull_request:
    branches: [ "main", "master", "26.1.2" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: List files (для отладки)
        run: ls -R build/libs/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nocturn-Client
          path: build/libs/*.jar
          if-no-files-found: error
